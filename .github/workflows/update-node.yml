# Daily check of https://nodejs.org/dist/index.json. When a newer 24.x LTS exists it opens a
# PR that bumps NODE_VERSION and package/expected.sha256, then dispatches ci.yml on the PR
# branch. Merging the PR triggers release.yml.
#
# A PR opened with GITHUB_TOKEN does not trigger pull_request workflows. workflow_dispatch is
# the documented exception, so this job dispatches CI itself; its checks attach to the PR's
# head commit. No long-lived secret is involved. The repository setting "Allow GitHub Actions
# to create and approve pull requests" must be on.
name: update-node

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write       # push the update branch
      pull-requests: write  # open the PR
      actions: write        # dispatch ci.yml on the update branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Open a PR if a newer Node 24 exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci-update-node.sh
